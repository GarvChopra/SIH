<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose a new PIN &middot; SAMANVAY</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/samanvay.css') }}">
</head>
<body>
<div class="tri"></div>
<div class="auth-card-wrap" style="min-height:calc(100dvh - 4px)">
  <div class="auth-card"><div class="card">
    <h1>Choose a new PIN</h1>
    <p class="muted" style="margin:4px 0 16px">Your account uses a temporary PIN. Set your own to continue.</p>
    {% if error %}<div class="banner err" role="alert"><div>{{ error }}</div></div>{% endif %}
    <form method="post" action="/set-pin/submit" class="form">
      <label class="f">New PIN <span class="hint">4 to 8 digits</span><input name="new" type="password" inputmode="numeric" required></label>
      <label class="f">Confirm PIN<input name="confirm" type="password" inputmode="numeric" required></label>
      <button class="btn block" type="submit">Save PIN</button>
    </form>
  </div></div>
</div>
</body>
</html>
